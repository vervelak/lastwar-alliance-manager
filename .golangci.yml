version: "2"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - bodyclose
    - durationcheck
    - nilerr
    - prealloc
    - unconvert
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    staticcheck:
      checks: ["SA"]
  exclusions:
    rules: []

issues:
  max-issues-per-linter: 50
  max-same-issues: 5

run:
  timeout: 5m
