name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libtesseract-dev libleptonica-dev

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        # G104=unhandled err (HTTP pattern), G115=RGBA uint8(c>>8), G201=validated SQL col, G301/G304=output paths
        run: gosec -exclude=G104,G115,G201,G301,G304 -exclude-dir=mg_segment ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libtesseract-dev libleptonica-dev

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Run tests
        run: go test ./... -race -cover -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t lastwar-alliance:ci .

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v7

      - name: Build and start container
        run: |
          docker build -t lastwar-alliance:ci .
          docker run -d --name lastwar-ci \
            -p 8080:8080 \
            -e SESSION_KEY="ci-test-session-key-at-least-32-bytes-long" \
            lastwar-alliance:ci
          # Wait for server to be ready (uses /api/health which returns 200)
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health && break || sleep 1
          done
          # Fail the step if server is still not reachable, printing container logs
          curl -sf http://localhost:8080/api/health || (echo "=== Container logs ===" && docker logs lastwar-ci && exit 1)

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: playwright-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: playwright-tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:8080

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-tests/report/

      - name: Stop container
        if: always()
        run: docker stop lastwar-ci && docker rm lastwar-ci
